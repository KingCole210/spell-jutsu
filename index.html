<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spell Jutsu Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen night arena; two ninjas face off on a rooftop, a scroll panel below runs each turn. Single dark look by choice. */
:root{
  --night:#141a33; --night-2:#1f2750; --ink:#0c1024;
  --paper:#f3e6c8; --paper-ink:#2b2216;
  --moon:#f6efd6; --persimmon:#ff7a3d; --muted:#a6acd0;
  --display:"Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --body:"Zen Maru Gothic", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--moon);font-family:var(--body);font-size:16px;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,46px);margin:0;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
h1 span{color:var(--persimmon)}
.tag{color:var(--muted);margin:4px 0 0;font-weight:500}
button{font-family:var(--body);font-weight:900;font-size:16px;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--persimmon);color:var(--ink)}
button.ghost{background:transparent;color:var(--moon);border:2px solid var(--night-2)}
button:focus-visible,input:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

/* setup */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pcard{background:var(--night-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.lab{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:6px}
input[type=text]{font-family:var(--body);font-size:18px;font-weight:700;padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--moon);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--ink);color:var(--moon);padding:8px 12px;border-radius:999px;font-size:14px;border:2px solid transparent}
.chip[aria-pressed=true]{border-color:var(--c,var(--persimmon));color:var(--c,var(--persimmon))}
.swatch{width:36px;height:36px;padding:0;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatch[aria-pressed=true]{border-color:var(--moon);box-shadow:0 0 0 2px var(--ink) inset}
.lvl-note{font-size:14px;color:var(--muted);margin:0;text-transform:none;letter-spacing:0;font-weight:500;line-height:1.4}
.start-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cycle{background:var(--night-2);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-weight:700}
.cycle .t{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;width:100%}
.el{color:var(--c);font-weight:900}
.arrow{color:var(--muted);font-size:13px}

/* arena */
.arena{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(var(--ink),var(--night-2));aspect-ratio:16/8;max-width:100%;min-height:220px}
.moon{position:absolute;right:42%;top:12%;width:12%;aspect-ratio:1;border-radius:50%;background:var(--moon);box-shadow:0 0 60px 10px rgba(246,239,214,.25)}
.roof{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--ink);clip-path:polygon(0 30%,8% 0,92% 0,100% 30%,100% 100%,0 100%)}
.ninja{position:absolute;bottom:20%;width:22%;max-width:150px}
.ninja.left{left:9%}
.ninja.right{right:9%}
.ninja.right svg{transform:scaleX(-1)}
.ninja.hit{animation:shake .45s}
.ninja.turn::after{content:"";position:absolute;left:20%;right:20%;bottom:-8px;height:6px;border-radius:6px;background:var(--c)}
.shield{position:absolute;inset:-14% -18%;border-radius:50%;border:4px solid var(--sc);box-shadow:0 0 22px var(--sc),inset 0 0 22px var(--sc);opacity:.85;animation:pulse 1.6s ease-in-out infinite}
.shield span{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--sc);white-space:nowrap;text-shadow:0 2px 0 var(--ink)}
@keyframes pulse{50%{opacity:.5}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:12px}
.hp{flex:1;max-width:44%;min-width:0}
.hp .name{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp.r{text-align:right}
.bar{height:12px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:var(--c);transition:width .6s ease}
.hp.r .bar i{margin-left:auto}
.hp small{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.fx{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;bottom:38%;width:9%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--c) 45%,transparent 70%);filter:drop-shadow(0 0 14px var(--c))}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(18px,4.6vw,36px);white-space:nowrap;text-shadow:0 3px 0 var(--ink);animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}

/* scroll panel */
.scroll{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 6px #e4d2a8}
.who{font-family:var(--display);font-size:22px;margin:0}
.jutsu{font-weight:900;color:#8a3a14;margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.sentence{font-size:19px;font-weight:700;margin:0;line-height:1.45;max-width:60ch}
.sentence b{display:inline-block;min-width:4ch;border-bottom:3px solid var(--paper-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wordbox{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:2px dashed #d4bf92}
.wordbox:first-of-type{border-top:0;padding-top:0}
.scroll input[type=text]{background:#fffaf0;color:var(--paper-ink);border-color:var(--paper-ink);font-size:26px;letter-spacing:.08em;flex:1;min-width:0}
.scroll button.ghost{color:var(--paper-ink);border-color:var(--paper-ink)}
.scroll .chip{background:#fffaf0;color:var(--paper-ink);border-color:#d4bf92;font-weight:900}
.scroll .chip[aria-pressed=true]{background:var(--c);color:var(--ink);border-color:var(--paper-ink)}
.picktitle{font-weight:900;margin:0;font-size:16px}
.needs{font-size:14px;margin:0;color:#6b5a3e;font-weight:700}
.seals{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.meaning{margin:0;font-weight:700;color:#6b5a3e}
.meaning b{color:var(--paper-ink)}
.accents button{min-width:40px;padding:6px 10px;font-size:18px;text-transform:none}
.answer{margin:0;font-weight:700;color:#6b5a3e}
.answer b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.08em;color:var(--paper-ink)}
.seals.watch{min-height:36px}
.seals.watch .seal{width:32px;height:32px;font-size:16px}
.seal.ok{background:#2f8f57;color:#fff}
.seal.bad{background:#c2333f;color:#fff}
.seal.empty{background:transparent;border:2px dashed #b8a37a;color:transparent;animation:none}
.watchnote{margin:0;font-weight:700;font-size:15px;min-height:1.2em}
.watchnote.ok{color:#1d7a46}.watchnote.bad{color:#b3202f}
.seal{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:14px;animation:sealIn .2s;background:var(--paper-ink);color:var(--paper)}
@keyframes sealIn{from{transform:scale(.3) rotate(-30deg)}}
.result{font-size:18px;font-weight:700;margin:0;line-height:1.45}
.result .ok{color:#1d7a46}.result .no{color:#b3202f}
.correct{font-family:var(--display);font-size:26px;letter-spacing:.06em;margin:0}
.peeked{font-family:var(--display);font-size:30px;letter-spacing:.08em;color:#8a3a14;margin:0}
.log{color:var(--muted);font-size:14px;margin:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.scroll .hint{color:#6b5a3e}
.win h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--night-2);border-radius:12px;padding:14px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.missed{margin:6px 0 0;padding-left:18px;color:var(--muted)}
button{touch-action:manipulation}
.scroll input.active{box-shadow:0 0 0 3px var(--persimmon)}
.scroll input[readonly]{caret-color:transparent;cursor:pointer}
.kb{background:var(--ink);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kb .r[hidden]{display:none}
.kb .r{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:46px;min-width:0;height:48px;padding:0;border-radius:7px;font-size:19px;background:var(--night-2);color:var(--moon);text-transform:uppercase}
.kb button:active{background:var(--persimmon);color:var(--ink)}
.kb button.wide{flex:1.7;max-width:78px;font-size:15px;text-transform:none}
.kb button.go{background:var(--persimmon);color:var(--ink)}
.wrap{padding-bottom:120px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.confirmbar{background:var(--night-2);border-left:4px solid var(--persimmon);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:700}
.confirmbar span{flex:1 1 220px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.titles{min-width:0;flex:1 1 280px}
.sharebox{background:var(--night-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.share-t{margin:0;font-weight:700}
.sharebox input[type=text]{font-size:15px;flex:1;min-width:0}
.textlink{color:var(--persimmon);font-weight:900}
.roombox{background:var(--night-2);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:16px}
.roomcode{display:flex;flex-direction:column;gap:2px}
.qr{background:#fff;padding:10px;border-radius:10px;width:172px;height:172px;flex:none;display:grid;place-items:center}
.qr img,.qr canvas{display:block;width:152px!important;height:152px!important}
.roominfo{display:flex;flex-direction:column;gap:10px;flex:1 1 240px;min-width:0}
.roomcode .t{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.roomcode b{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.12em;color:var(--persimmon)}
#linkLine{width:100%}
.linktext{user-select:all;-webkit-user-select:all;word-break:break-all;color:var(--moon)}
.codein{text-transform:uppercase;letter-spacing:.2em;flex:1;min-width:0}
.readybtn{width:100%;padding:14px;font-size:17px}
.pcard.is-ready{box-shadow:inset 0 0 0 3px var(--good,#5fd38d)}
.livecard{grid-column:1/-1}
.liveroom{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ink)}
.liveroom:first-child{border-top:0}
.liveinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.liveinfo b{font-size:17px}
.opencard{border:2px dashed var(--muted);background:transparent}
.check{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--muted);font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--persimmon)}
.crowd{background:var(--night-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.crowd h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0}
.crowdcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.crowd .t{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.line{margin:6px 0 0;padding-left:22px;font-weight:700}
.line li.me{color:var(--persimmon)}
.notice{background:var(--night-2);border-left:4px solid var(--persimmon);border-radius:8px;padding:12px 14px;margin:0;font-weight:700;line-height:1.4}
.seatline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:40px}
.you{color:var(--good,#5fd38d);font-weight:900}
.taken{color:var(--muted);font-weight:700}
button.small{padding:6px 12px;font-size:14px}
.chips button:disabled{opacity:.5}
hr.cut{border:0;border-top:2px dashed #d4bf92;margin:2px 0;width:100%}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="titles">
      <h1>Spell Jutsu <span>Duel</span></h1>
      <p class="tag">Hear the word. Spell it right and your jutsu strikes. Miss one letter and it fizzles.</p>
    </div>
    <div class="topbtns"><button class="ghost small" id="homeBtn" hidden>🏠 Main menu</button><button class="ghost small" id="shareBtn" aria-expanded="false" aria-controls="sharePanel">📲 Share</button></div>
  </header>
  <div class="confirmbar" id="homeConfirm" hidden>
    <span id="homeConfirmText">Leave this duel and go to the main menu?</span>
    <button id="homeYes">Yes, main menu</button>
    <button class="ghost" id="homeNo">Stay</button>
  </div>

  <div class="sharebox" id="sharePanel" hidden>
    <p class="share-t">Send this link. Tapping it opens the game in any phone or computer browser.</p>
    <div class="row">
      <input type="text" id="shareLink" readonly aria-label="Game link">
      <button id="copyLink">Copy link</button>
    </div>
    <p class="hint" id="copyMsg">Paste it into a text to send it.</p>
  </div>
  <p class="notice" id="notice" hidden></p>

  <section id="setupView">
    <div id="roomBox"></div>
    <div class="setup" id="setupCards"></div>
    <div class="cycle" id="cycleSetup" style="margin-top:16px"></div>
    <div class="start-row" style="margin-top:16px" id="startRow"></div>
  </section>

  <section id="gameView" hidden>
    <div class="arena" id="arena">
      <div class="moon"></div>
      <div class="roof"></div>
      <div class="hud">
        <div class="hp" id="hp0"><div class="name"></div><div class="bar"><i></i></div><small></small></div>
        <div class="hp r" id="hp1"><div class="name"></div><div class="bar"><i></i></div><small></small></div>
      </div>
      <div class="ninja left" id="n0"></div>
      <div class="ninja right" id="n1"></div>
      <div class="fx" id="fx"></div>
    </div>
    <div class="scroll" id="panel"></div>
    <div class="cycle" id="cycleGame" hidden></div>
    <p class="log" id="log"></p>
    <div class="start-row" id="gameCtl"></div>
  </section>

  <section id="winView" class="win" hidden></section>
  <section id="crowd" class="crowd" hidden aria-label="Room"></section>
</div>
<div class="kb" id="kb" hidden aria-label="Letter keyboard"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(x)"></script>
<script>
/* Element cycle: each one beats the next. Fire > Wind > Lightning > Water > Fire */
const ELEMENTS = {
  fire:{label:"Fire", c:"#ff7a3d", beats:"wind", moves:["Ember Fox Blast","Phoenix Flare","Blazing Comet"]},
  wind:{label:"Wind", c:"#7ee08a", beats:"lightning", moves:["Cyclone Palm","Razor Leaf Gale","Sky Blade Spiral"]},
  lightning:{label:"Lightning", c:"#ffe14d", beats:"water", moves:["Thunder Hawk Dive","Storm Needle","Static Wolf Howl"]},
  water:{label:"Water", c:"#4fb3ff", beats:"fire", moves:["Tidal Serpent","Rain Spear Volley","Whirlpool Fang"]}
};
const EL_KEYS = Object.keys(ELEMENTS);
const counterOf = shield => EL_KEYS.find(k=>ELEMENTS[k].beats===shield);
const BAND_COLORS = ["#ff7a3d","#4fb3ff","#ffe14d","#7ee08a","#c18bff","#ff6fae"];
const LEVELS = {
  academy:{label:"Academy Student", short:"Academy", el:"none", double:0,
    note:"Ages 4–6. First words. No elements, just spell it right."},
  genin:{label:"Genin", short:"Genin", el:"bonus", double:0,
    note:"Grades 3–5. Pick the element that beats the enemy's shield for 1.5× damage."},
  chunin:{label:"Chunin", short:"Chunin", el:"bonus", double:0,
    note:"7th grade. Pick the element that beats the enemy's shield for 1.5× damage."},
  jonin:{label:"Jonin", short:"Jonin", el:"must", double:.4,
    note:"Senior high school. Sometimes two words at once. The wrong element backfires on you."},
  kage:{label:"Kage", short:"Kage", el:"must", double:.6,
    note:"College level. Two words more often. The wrong element backfires on you, and there's no element chart."}
};
const BONUS = 1.5, BACKFIRE = 12, MAX_HP = 100;
/* Ninja 1 is always MC. Ninja 2's name comes from the level picked. */
const LEVEL_NAMES = {academy:"Ant", genin:"Ant", chunin:"Drew", jonin:"Ri", kage:"Ri"};
/* older saved games used these level names */
const LVL_ALIAS = {beginner:"academy", medium:"chunin", hard:"jonin"};
const normLvl = l => LEVELS[l] ? l : (LVL_ALIAS[l] || "academy");

const parsed = {}, parsedEs = {};

for (const k in WORDS_ES) parsedEs[k] = WORDS_ES[k].trim().split("\n").map(l=>{const [w,s,en]=l.split("|");return {w:w.trim(),s:s.trim(),en:(en||"").trim(),lang:"es"}});
const ES_RANKS = Object.keys(WORDS_ES);
const seatLang = s => (s && s.lang==="es" && ES_RANKS.includes(s.lvl)) ? "es" : "en";
const rankLabel = s => LEVELS[s.lvl].label + (seatLang(s)==="es" ? " · Español" : "");
/* accent marks are optional (café = cafe), but ñ counts as its own letter */

const wordRe = w => new RegExp("(?<![\\p{L}])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\p{L}])","iu");

const seatName = (d,i) => cleanName(d.seats[String(i)].name) || seatFallback(d,i);

/* ---------- storage + online rooms (direct device-to-device, no accounts) ---------- */
function mergeInto(a,b){ for(const k in b){ const v=b[k];
  if(v && typeof v==="object" && !Array.isArray(v) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k])) mergeInto(a[k],v); else a[k]=clone(v); } return a; }
function makeLocalStore(){
  let data=null; const subs=new Set();
  const snap=()=>({exists:!!data, data:()=>clone(data)});
  const emit=()=>setTimeout(()=>subs.forEach(f=>f(snap())));
  return {
    set: async d=>{ data=clone(d); emit(); },
    update: async d=>{ data=mergeInto(data||{},d); emit(); },
    onSnapshot(f){ subs.add(f); if(data) setTimeout(()=>f(snap())); return ()=>subs.delete(f); }
  };
}
let mode=null, store=null, myId=null, unsub=null, readOnly=false;

  casting=false; const b=$("castBtn"); if(b) b.disabled=false;

}

const PEER_PREFIX="spelljutsu-duel-";

/* ---------- online rooms: the host's device runs the room ----------
   Two seats play; everyone else watches. Watchers can "call next" to get in line.
   After a duel each player picks Rematch or I'm done; I'm done hands the seat
   to the next person in line. */
const CID_KEY="spelljutsu-cid";
const myCid=(()=>{ try{ let c=localStorage.getItem(CID_KEY); if(!c){ c="c"+rid()+rid(); localStorage.setItem(CID_KEY,c); } return c; }catch(e){ return "c"+rid()+rid(); } })();
const NEXTNAME_KEY="spelljutsu-my-name";
function myName(){ try{ return localStorage.getItem(NEXTNAME_KEY)||""; }catch(e){ return ""; } }
function rememberMyName(n){ try{ localStorage.setItem(NEXTNAME_KEY,n); }catch(e){} }

let clients=new Map();           /* host only: peer connection -> client id */
let beacon=null;                 /* host only: makes the room show in Live games */
const LIVE_PREFIX="spelljutsu-live-", LIVE_SLOTS=12;
const PUBLIC_KEY="spelljutsu-public";
function isPublicPref(){ try{ return localStorage.getItem(PUBLIC_KEY)!=="no"; }catch(e){ return true; } }
function setPublicPref(v){ try{ localStorage.setItem(PUBLIC_KEY, v?"yes":"no"); }catch(e){} }

function openConns(){ return [...clients.keys()].filter(c=>c.open); }
function broadcast(msg, except){ openConns().forEach(c=>{ if(c!==except){ try{ c.send(msg); }catch(e){} } }); }
function connOf(uid){ for(const [c,id] of clients) if(id===uid && c.open) return c; return null; }
const seatIdx = (d,uid) => d.seats["0"].uid===uid ? 0 : d.seats["1"].uid===uid ? 1 : -1;
const seatOpen = s => !s.uid;
const onlineNow = uid => uid==="host" || !!connOf(uid);

function makeHostStore(initial){
  let data=clone(initial); const subs=new Set();
  const snap=()=>({exists:true, data:()=>clone(data)});
  const push=()=>{
    setTimeout(()=>subs.forEach(f=>f(snap())));
    broadcast({type:"doc", data});
    saveHost();
  };
  return {
    peek:()=>data, push,
    mutate(fn){ fn(data); push(); },
    update: async p=>{ data=mergeInto(data,p); push(); },
    onSnapshot(f){ subs.add(f); setTimeout(()=>f(snap())); return ()=>subs.delete(f); }
  };
}
function makeGuestStore(){
  let data=null; const subs=new Set();
  const snap=()=>({exists:!!data, data:()=>clone(data)});
  return {
    receive(d){ data=d; subs.forEach(f=>f(snap())); },
    update: async p=>{ if(!linkUp()) throw {code:"offline"}; conn.send({type:"update", patch:p}); },
    onSnapshot(f){ subs.add(f); if(data) setTimeout(()=>f(snap())); return ()=>subs.delete(f); }
  };
}

/* ---- room rules, run on the host ---- */
function blankSeat(color, lvl){ return {uid:null, name:"", color, lvl, lang:"en", ready:false, again:null, away:false}; }
function freeColor(d, i){ const other=d.seats[String(1-i)].color; return BAND_COLORS.find(c=>c!==other) || BAND_COLORS[0]; }
function fillSeat(d, i){
  const k=String(i), old=d.seats[k];
  d.queue = (d.queue||[]).filter(u=>onlineNow(u) && seatIdx(d,u)<0);
  const uid = d.queue.shift() || null;
  const s = blankSeat(old.color===d.seats[String(1-i)].color ? freeColor(d,i) : old.color, "academy");
  if(uid){ s.uid=uid; s.name=cleanName((d.people[uid]||{}).name); }
  d.seats[k]=s;
}
function toLobby(d){
  d.status="lobby"; d.phase="ready"; d.cur=null;
  ["0","1"].forEach(k=>{ d.seats[k].ready=false; d.seats[k].again=null; });
}
function hostAct(uid, a){
  if(!a || typeof a!=="object" || !store || !store.mutate) return;
  store.mutate(d=>{
    d.queue=d.queue||[]; d.people=d.people||{};
    const mineAt=seatIdx(d,uid);
    if(a.kind==="next"){
      const nm=cleanName(a.name);
      d.people[uid]={...(d.people[uid]||{}), name:nm};
      if(mineAt<0 && !d.queue.includes(uid)) d.queue.push(uid);
      /* an empty seat outside a duel goes straight to the first in line */
      [0,1].forEach(i=>{ if(seatOpen(d.seats[String(i)]) && d.status!=="playing" && d.queue.length){ fillSeat(d,i); toLobby(d); } });
    }
    else if(a.kind==="unnext"){ d.queue=d.queue.filter(u=>u!==uid); }
    else if(a.kind==="sit"){
      if(mineAt>=0) return;
      const i=[0,1].find(j=>{ const s=d.seats[String(j)]; return seatOpen(s) || (s.away && !onlineNow(s.uid)); });
      if(i===undefined) return;
      if(d.queue.length && d.queue[0]!==uid && seatOpen(d.seats[String(i)])) return; /* line goes first */
      d.queue=d.queue.filter(u=>u!==uid);
      const s=blankSeat(d.seats[String(i)].color, "academy"); s.uid=uid; s.name=cleanName((d.people[uid]||{}).name);
      if(s.color===d.seats[String(1-i)].color) s.color=freeColor(d,i);
      d.seats[String(i)]=s;
      toLobby(d);
    }
    else if(a.kind==="again" && mineAt>=0 && d.status==="over"){
      const me=d.seats[String(mineAt)];
      if(a.v){
        me.again=true;
        const other=d.seats[String(1-mineAt)];
        if(other.uid && other.again===true){
          Object.assign(d, freshMatch());
          ["0","1"].forEach(k=>{ d.seats[k].again=null; d.seats[k].ready=false; });
        }
      } else {
        fillSeat(d, mineAt);
        toLobby(d);
      }
    }
    else if(a.kind==="stepout" && mineAt>=0 && d.status!=="playing"){
      fillSeat(d, mineAt); toLobby(d);
    }
  });
}
/* send a room action: the host runs it, everyone else asks the host */
function act(a){
  if(mode!=="online") return;
  if(isHost) return hostAct(myId, a);
  if(!linkUp()) return notice("Not connected to the room right now. Reconnecting…");
  try{ conn.send({type:"act", action:a}); }catch(e){}
}

function clientJoined(c, cid){
  clients.set(c, cid);
  store.mutate(d=>{
    d.people=d.people||{}; d.queue=d.queue||[];
    d.people[cid]={name:cleanName((d.people[cid]||{}).name), on:true};
    const at=seatIdx(d,cid);
    if(at>=0){ d.seats[String(at)].away=false; return; }          /* a player coming back */
    const i=[0,1].find(j=>seatOpen(d.seats[String(j)]));
    if(i!==undefined && !d.queue.length && d.status!=="playing"){ /* first one in gets the open seat */
      const s=blankSeat(d.seats[String(i)].color, d.seats[String(i)].lvl); s.uid=cid;
      if(s.color===d.seats[String(1-i)].color) s.color=freeColor(d,i);
      d.seats[String(i)]=s; toLobby(d);
    }
  });
  notice("");
}
function clientLeft(c){
  const cid=clients.get(c); if(cid===undefined) return;
  clients.delete(c);
  if(connOf(cid)) return;                                       /* still connected on another link */
  store.mutate(d=>{
    d.queue=(d.queue||[]).filter(u=>u!==cid);
    const at=seatIdx(d,cid);
    if(d.people && d.people[cid]){ if(at>=0) d.people[cid].on=false; else delete d.people[cid]; }
    if(at<0) return;
    if(d.status==="playing"){ d.seats[String(at)].away=true; d.seats[String(at)].ready=false; }
    else { fillSeat(d, at); toLobby(d); }
  });
  const d=store.peek(), name=cleanName((d.people[cid]||{}).name);
  if(seatIdx(d,cid)>=0) notice(`${name||"Your opponent"} lost connection. They can rejoin with the same link, or a watcher can take their seat.`);
}
function roomInfo(){
  const d=store.peek(), hostAt=seatIdx(d,"host");
  const open=[0,1].some(i=>seatOpen(d.seats[String(i)]));
  return {type:"info", code:roomCode, host: hostAt>=0 ? seatName(d,hostAt) : (cleanName((d.people.host||{}).name)||"MC"),
    rank: hostAt>=0 ? LEVELS[d.seats[String(hostAt)].lvl].label : "",
    open, line:(d.queue||[]).length, watching: watcherIds(d).length, status:d.status};
}
function watcherIds(d){
  const ppl=d.people||{};
  return Object.keys(ppl).filter(u=>ppl[u] && ppl[u].on!==false && seatIdx(d,u)<0);
}

const NET_ERRORS=["network","server-error","socket-error","socket-closed","browser-incompatible"];
async function peerReady(){
  for(let i=0;i<80 && typeof window.Peer!=="function";i++) await new Promise(r=>setTimeout(r,100));
  return typeof window.Peer==="function";
}
function closePeer(){
  clearTimeout(retryTimer); stopScan();
  try{ conn && conn.close(); }catch(e){}
  for(const c of clients.keys()){ try{ c.close(); }catch(e){} }
  try{ peer && peer.destroy(); }catch(e){}
  try{ beacon && beacon.destroy(); }catch(e){}
  peer=null; conn=null; beacon=null; clients=new Map();
}
function keepAlive(p){
  p.on("disconnected",()=>{ setTimeout(()=>{ try{ if(!p.destroyed) p.reconnect(); }catch(e){} },2000); });
}

async function hostRoom(code, savedDoc){
  closePeer();
  mode="online"; isHost=true; myId="host"; roomCode=code; readOnly=false;
  const doc = savedDoc ? clone(savedDoc) : freshDoc(null);
  ["0","1"].forEach(k=>{ const s=doc.seats[k]; s.lvl=normLvl(s.lvl); if(s.again===undefined) s.again=null; s.away=false; });
  doc.queue=[]; doc.people={host:{name:"", on:true}};
  if(seatIdx(doc,"host")<0 && !doc.seats["0"].uid) doc.seats["0"].uid="host";
  ["0","1"].forEach(k=>{ const u=doc.seats[k].uid; if(u && u!=="host"){ doc.seats[k].away=true; doc.seats[k].ready=false; } });
  if(doc.status!=="playing") ["0","1"].forEach(k=>{ const s=doc.seats[k]; if(s.uid && s.uid!=="host"){ doc.seats[k]=blankSeat(s.color, s.lvl); } });
  store=makeHostStore(doc); saveHost();
  setUrl(roomLink(code));
  subscribe();
  if(!(await peerReady())) return notice("Online play couldn't load. Check your internet connection and reload the page.");
  openHostPeer(code, 0);
}
function openHostPeer(code, attempt){
  if(!isHost || roomCode!==code) return;
  const p = peer = new Peer(PEER_PREFIX+code.toLowerCase(), {debug:0});
  keepAlive(p);
  p.on("open",()=>{ notice(""); if(isPublicPref()) openBeacon(1); if(latest) render(); });
  p.on("connection",c=>{
    let joined=false;
    const fallback=setTimeout(()=>{ if(!joined && c.open){ joined=true; clientJoined(c, "anon"+rid()); } }, 2500);
    c.on("data",m=>{
      if(!m || typeof m!=="object") return;
      if(m.type==="hello"){ if(joined) return; joined=true; clearTimeout(fallback);
        clientJoined(c, typeof m.cid==="string" && /^[a-z0-9]{4,40}$/i.test(m.cid) && m.cid!=="host" ? m.cid : "anon"+rid()); return; }
      const cid=clients.get(c); if(cid===undefined) return;
      const d=store.peek(), at=seatIdx(d,cid);
      if(m.type==="update" && at>=0 && m.patch && typeof m.patch==="object") store.update(m.patch);
      else if(m.type==="typing" && at>=0 && at===d.turn){ onTyping(m); broadcast(m, c); }
      else if(m.type==="act") hostAct(cid, m.action);
      else if(m.type==="bye"){ clientLeft(c); try{ c.close(); }catch(e){} }
    });
    c.on("close",()=>{ clearTimeout(fallback); clientLeft(c); });
    c.on("error",()=>{});
  });
  p.on("error",e=>{
    if(e.type==="unavailable-id"){
      /* Right after a reload the server may still be holding the old room for a few seconds. */
      try{ p.destroy(); }catch(err){}
      if(attempt<8){ notice("Reopening your room…"); retryTimer=setTimeout(()=>openHostPeer(code, attempt+1), 2500); }
      else notice(`Room ${code} is already open on another screen. Close it there, or go back and create a new room.`);
    }
    else if(NET_ERRORS.includes(e.type)) notice("Can't reach the game server. Check your internet connection.");
  });
}
function openBeacon(slot){
  if(!isHost || slot>LIVE_SLOTS || (beacon && !beacon.destroyed)) return;
  const b = beacon = new Peer(LIVE_PREFIX+slot, {debug:0});
  b.on("connection",c=>{
    c.on("open",()=>{ try{ c.send(roomInfo()); }catch(e){} setTimeout(()=>{ try{ c.close(); }catch(e){} },1500); });
    c.on("error",()=>{});
  });
  b.on("error",e=>{ if(e.type==="unavailable-id"){ try{ b.destroy(); }catch(x){} if(beacon===b){ beacon=null; openBeacon(slot+1); } } });
  b.on("disconnected",()=>{ setTimeout(()=>{ try{ if(beacon===b && !b.destroyed) b.reconnect(); }catch(e){} },2000); });
}
function setPublic(v){
  setPublicPref(v);
  if(!isHost) return;
  if(v) openBeacon(1);
  else { try{ beacon && beacon.destroy(); }catch(e){} beacon=null; }
}
function hostLeft(){
  const d=latest, at=d?seatIdx(d,"host"):-1;
  const nm = at>=0 ? seatName(d,at) : "The host";
  renderHome();
  notice(`${nm} closed the game room. Make your own room, or join another one from Live games.`);
}

async function joinRoom(code){
  closePeer();
  mode="online"; isHost=false; myId=myCid; roomCode=code; readOnly=false;
  store=makeGuestStore(); subscribe();
  setUrl(roomLink(code));
  renderJoining(code);
  if(!(await peerReady())) return notice("Online play couldn't load. Check your internet connection and reload the page.");
  const p = peer = new Peer({debug:0});
  keepAlive(p);
  const retry=()=>{ clearTimeout(retryTimer); retryTimer=setTimeout(connect,3000); };
  function connect(){
    if(peer!==p || p.destroyed) return;
    const c=p.connect(PEER_PREFIX+code.toLowerCase(), {reliable:true});
    conn=c;
    c.on("open",()=>{ notice(""); try{ c.send({type:"hello", cid:myCid}); }catch(e){} });
    c.on("data",m=>{
      if(!m || typeof m!=="object") return;
      if(m.type==="doc" && m.data) store.receive(m.data);
      else if(m.type==="typing") onTyping(m);
      else if(m.type==="bye") hostLeft();
    });
    c.on("close",()=>{ if(conn===c){ conn=null; notice("Lost the connection to the room. Reconnecting…"); retry(); } });
    c.on("error",()=>{});
  }
  p.on("open",connect);
  p.on("error",e=>{
    if(e.type==="peer-unavailable"){ conn=null; notice(`Can't find room ${code} yet. The host needs to have the game open. Trying again…`); retry(); }
    else if(NET_ERRORS.includes(e.type)) notice("Can't reach the game server. Check your internet connection.");
  });
}

/* ---- Live games list on the home screen ---- */
let scanPeer=null, scanTimer=null;
async function scanLive(){
  const box=$("liveList"); if(!box) return;
  box.innerHTML=`<p class="lvl-note">Looking for live games…</p>`;
  if(!(await peerReady())){ box.innerHTML=`<p class="lvl-note">Live games couldn't load. Check your internet connection.</p>`; return; }
  if(mode!==null) return;
  stopScan();
  const found={}, sp=scanPeer=new Peer({debug:0});
  sp.on("open",()=>{
    for(let n=1;n<=LIVE_SLOTS;n++){
      const c=sp.connect(LIVE_PREFIX+n, {reliable:true});
      c.on("data",m=>{ if(m && m.type==="info" && typeof m.code==="string"){ found[cleanCode(m.code)]=m; paintLive(found,false); } try{ c.close(); }catch(e){} });
      c.on("error",()=>{});
    }
  });
  sp.on("error",e=>{ if(NET_ERRORS.includes(e.type)){ const b=$("liveList"); if(b) b.innerHTML=`<p class="lvl-note">Can't reach the game server. Check your internet connection.</p>`; } });
  scanTimer=setTimeout(()=>{ paintLive(found,true); stopScan(); }, 5000);
}
function stopScan(){ clearTimeout(scanTimer); try{ scanPeer && scanPeer.destroy(); }catch(e){} scanPeer=null; }
function paintLive(found, done){
  const box=$("liveList"); if(!box || mode!==null) return;
  const rooms=Object.values(found);
  if(!rooms.length){
    box.innerHTML = done ? `<p class="lvl-note">No live games right now. Create a room and it shows up here for everyone.</p>` : `<p class="lvl-note">Looking for live games…</p>`;
    return;
  }
  box.innerHTML = rooms.map(r=>{
    const bits=[r.rank, r.status==="playing"?"Duel in progress":r.status==="over"?"Between duels":"Getting ready"];
    if(r.watching) bits.push(`${r.watching} watching`);
    if(r.line) bits.push(`${r.line} in line`);
    return `<div class="liveroom"><div class="liveinfo"><b>${esc(String(r.host||"Someone").slice(0,14))}'s room</b><span class="hint">${bits.filter(Boolean).map(esc).join(" · ")}</span></div>
      <button data-live="${esc(cleanCode(r.code))}" ${r.open && !r.line?"":'class="ghost"'}>${r.open && !r.line?"Join":"Watch"}</button></div>`;
  }).join("") + (done?"":`<p class="lvl-note">Still looking…</p>`);
  box.querySelectorAll("[data-live]").forEach(b=>b.onclick=()=>{ stopScan(); unlockAudio(); joinRoom(b.dataset.live); });
}

function subscribe(){
  if(unsub) unsub();
  latest=null; seenLastId=undefined; panelKey="";
  unsub = store.onSnapshot(s=>{ if(s.exists) onDoc(s.data()); });
}
function onDoc(d){
  latest=d;
  const lastId = d.last ? d.last.id : null;
  if(seenLastId===undefined){ seenLastId=lastId; render(); return maybeStart(d); }
  if(lastId && lastId!==seenLastId){
    seenLastId=lastId; animating=true;
    animate(d.last, ()=>{ animating=false; render(); });
    return;
  }
  seenLastId=lastId;
  if(!animating) render();
  maybeStart(d);
}

/* ---------- audio ---------- */
let actx=null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
document.addEventListener("pointerdown", unlockAudio, {once:true});
function tone(freq,dur,type="sine",slide=0,vol=.18){
  if(!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  seal(){tone(520+Math.random()*200,.07,"square",0,.06)},
  cast(){tone(300,.35,"sawtooth",600,.12);setTimeout(()=>tone(900,.3,"triangle",-500,.12),120)},
  hit(){tone(120,.4,"square",-60,.2)},
  fizzle(){tone(400,.5,"sawtooth",-330,.1)}
};
const canSpeak = "speechSynthesis" in window;
function speak(text,rate=.8,lang="en"){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=rate;
    u.lang = lang==="es" ? "es-MX" : "en-US";
    const v=speechSynthesis.getVoices().find(x=>x.lang && x.lang.toLowerCase().startsWith(lang==="es"?"es":"en"));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

const TOUCH = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
const kb=$("kb");
let spell=null, casting=false, activeIdx=0;
function buildKb(){
  const rows=["qwertyuiop","asdfghjkl","⌫zxcvbnm↵"];
  kb.innerHTML=rows.map(r=>`<div class="r">${[...r].map(ch=>
    ch==="⌫"?`<button class="wide" data-k="back" aria-label="Delete">⌫</button>`:
    ch==="↵"?`<button class="wide go" data-k="enter" id="kbEnter">Cast</button>`:
    `<button data-k="${ch}">${ch}</button>`).join("")}</div>`).join("")
    + `<div class="r" id="kbEs" hidden>${[..."áéíóúñü"].map(ch=>`<button data-k="${ch}">${ch}</button>`).join("")}</div>`;
  kb.addEventListener("pointerdown",e=>{
    const b=e.target.closest("button"); if(!b) return;
    e.preventDefault();
    if(!spell || !spell.active || casting) return;
    const k=b.dataset.k, inp=$("answer"+activeIdx);
    if(k==="enter") return submitField(activeIdx);
    if(!inp) return;
    if(k==="back") inp.value=inp.value.slice(0,-1);
    else if(inp.value.length<20) inp.value+=k;
    inp.dispatchEvent(new Event("input"));
  });
}

/* The keyboard sits inside the game panel, right below the spelling boxes,
   so nothing pinned to the bottom of the screen can cover it. */
function showKb(on){
  if(!TOUCH) return;
  if(on){
    const castRow=$("castBtn") && $("castBtn").closest(".row");
    if(castRow) castRow.parentNode.insertBefore(kb, castRow);
    const es=$("kbEs"); if(es) es.hidden = !(spell && spell.items.some(x=>x.lang==="es"));
    kb.hidden=false;
  } else {
    kb.hidden=true;
    if(kb.parentNode!==document.body) document.body.appendChild(kb);
  }
}
function setActive(k){
  activeIdx=k;
  document.querySelectorAll(".scroll input[id^=answer]").forEach(el=>el.classList.toggle("active",el.id==="answer"+k));
  const btn=$("kbEnter");
  if(btn) btn.textContent = $("answer"+(k+1)) ? "Next" : "Cast";

  const nxt=$("answer"+(k+1));
  if(nxt){ setActive(k+1); if(!TOUCH) nxt.focus(); speak(spell.items[k+1].w,.8,spell.items[k+1].lang); }

  else if(online && (!d.seats["0"].uid || !d.seats["1"].uid)) msg = isHost ? "Waiting for someone to join. Share your room, or keep it in Live games." : "Waiting for a second player.";
  else if(r0 && r1) msg="Both ninjas are ready. Starting…";
  else if(!online) msg="Each player picks a name, color and rank, then taps I'm ready. The duel starts when both are ready.";
  else if(!seated) msg="You're watching. Call next below to get in line.";
  else {
    const myI = mine(0)?0:1, other=1-myI;
    msg = !d.seats[myI].ready ? "Pick your name, color and rank, then tap I'm ready."
        : `Waiting for ${esc(seatName(d,other))} to be ready…`;
  }
  $("startRow").innerHTML = `
    <span class="hint">${msg}</span>
    <button class="ghost" id="menuBtn">${online ? (isHost ? "Close room" : "Leave room") : "Back to menu"}</button>`;
  $("menuBtn").onclick=()=>$("homeBtn").click();
}

/* The host (or the single device) starts the duel once both players are ready. */
let starting=false;
function maybeStart(d){
  const s0=d.seats["0"], s1=d.seats["1"];
  if(starting || d.status!=="lobby" || !s0.ready || !s1.ready) return;
  if(mode==="online" && (!isHost || !s0.uid || !s1.uid || s0.away || s1.away)) return;
  if(mode!=="local" && mode!=="online") return;
  starting=true;
  setTimeout(()=>{
    write({...freshMatch(), seats:{"0":{ready:false, again:null},"1":{ready:false, again:null}}}).finally(()=>{ starting=false; });
  }, 700);
}

/* ---------- game ---------- */
function setShield(target, el){
  document.querySelectorAll(".shield").forEach(s=>s.remove());
  if(target==null || !el) return;
  const s=document.createElement("div"); s.className="shield";
  s.style.setProperty("--sc",ELEMENTS[el].c);
  s.innerHTML=`<span>${ELEMENTS[el].label} shield</span>`;
  $("n"+target).appendChild(s);
}
function drawArena(d){
  [0,1].forEach(i=>{
    const s=d.seats[i], n=$("n"+i);
    if(n.dataset.color!==s.color){ n.innerHTML=ninjaSVG(s.color); n.dataset.color=s.color; }
    n.style.setProperty("--c",s.color);
    n.classList.toggle("turn", d.turn===i && d.status==="playing");
    const h=$("hp"+i); h.style.setProperty("--c",s.color);
    const youTag = mode==="online" && mine(i) && !mine(1-i) ? " (you)" : "";
    h.querySelector(".name").textContent=seatName(d,i)+youTag;
    h.querySelector("i").style.width=(d.hp[i]/MAX_HP*100)+"%";
    h.querySelector("small").textContent=d.hp[i]+" / "+MAX_HP+" chakra";
  });
  const sh = d.phase==="spelling" && d.cur ? d.cur.shield : null;
  setShield(sh ? 1-d.turn : null, sh);

}

function resultHTML(L,d){
  const nm=esc(seatName(d,L.by));
  const shield=L.shield, picked=L.picked;
  const elNote = shield && picked ? (picked===counterOf(shield)
      ? ` ${ELEMENTS[picked].label} beats ${ELEMENTS[shield].label}, so it was super effective!`
      : ` ${ELEMENTS[picked].label} doesn't beat ${ELEMENTS[shield].label}. ${ELEMENTS[counterOf(shield)].label} would have.`) : "";
  let msg;
  const accNote = (L.accentFix||[]).length && L.outcome!=="fizzle" ? ` Remember the accent${L.accentFix.length>1?"s":""}: <b>${L.accentFix.map(esc).join(", ")}</b>.` : "";
  if(L.outcome==="hit") msg=`<span class="ok">Direct hit!</span> ${nm} did ${L.dmg} damage.${elNote}${L.peeked?" (Half power after peeking.)":""}${accNote}`;
  else if(L.outcome==="backfire") msg=`<span class="no">Backfire!</span> ${nm} spelled it perfectly, but ${ELEMENTS[picked].label} can't break a ${ELEMENTS[shield].label} shield. ${nm} lost ${L.self} chakra. ${ELEMENTS[counterOf(shield)].label} was the right pick.`;
  else msg=`<span class="no">The jutsu fizzled.</span> ${nm} wrote ${L.guesses.map(g=>"“"+esc(g)+"”").join(" and ")}. ${L.wrong.length>1?"The right spellings are:":"The right spelling is:"}`;
  return `<p class="jutsu">Last turn · ${esc(L.move)}</p>
    <p class="result">${msg}</p>
    ${L.outcome==="fizzle"?L.wrong.map(w=>`<p class="correct">${esc(w)}</p>`).join("")+`<div class="row"><button class="ghost" data-say="${esc(L.wrong.join(". "))}" data-lang="${L.lang==="es"?"es":"en"}">🔊 Hear it</button></div>`:""}

function logLine(d){
  const L=d.last; if(!L) return "";

/* word picking: avoid repeats on this device until the list runs out */
/* Each device remembers which words it has used (even after a reload),
   so a word only comes back once its whole rank list has been used. */
const USED_KEY="spelljutsu-used-words";
const used = {}; for(const k in LEVELS) used[k]=new Set(); for(const k in WORDS_ES) used["es:"+k]=new Set();
try{ const saved=JSON.parse(localStorage.getItem(USED_KEY)||"{}");
  for(const k in used) if(Array.isArray(saved[k])) saved[k].forEach(w=>used[k].add(w)); }catch(e){}
function saveUsed(){ try{ const o={}; for(const k in used) o[k]=[...used[k]]; localStorage.setItem(USED_KEY, JSON.stringify(o)); }catch(e){} }
function pickWord(lvl, avoid, lang="en"){
  const src = lang==="es" ? parsedEs[lvl] : parsed[lvl], key = lang==="es" ? "es:"+lvl : lvl;
  let pool=src.filter(x=>!used[key].has(x.w) && !avoid.includes(x.w));
  if(!pool.length){ used[key].clear(); pool=src.filter(x=>!avoid.includes(x.w)); }
  const it=pool[Math.random()*pool.length|0]; used[key].add(it.w); saveUsed();
  return lang==="es" ? {w:it.w,s:it.s,en:it.en,lang:"es"} : {w:it.w,s:it.s};
}
function beginTurn(){
  const d=latest, i=d.turn, lvl=d.seats[i].lvl, lang=seatLang(d.seats[i]);
  const count = Math.random() < LEVELS[lvl].double ? 2 : 1;
  const items=[]; for(let k=0;k<count;k++) items.push(pickWord(lvl, items.map(x=>x.w), lang));
  const shield = LEVELS[lvl].el==="none" ? null : EL_KEYS[Math.random()*EL_KEYS.length|0];
  $("readyBtn").disabled=true;
  speak(items[0].w,.8,lang);
  write({phase:"spelling", cur:{id:rid(), items, shield}}).catch(()=>{ const b=$("readyBtn"); if(b) b.disabled=false; });
}

function wordBlock(item,idx,total){
  const blanked=esc(item.s).replace(wordRe(item.w),"<b>&nbsp;</b>");
  return `<div class="wordbox">
    ${total>1?`<p class="jutsu">Word ${idx+1} of ${total}</p>`:""}
    <p class="sentence">${blanked}</p>
    ${item.en?`<p class="meaning">In English: <b>${esc(item.en)}</b></p>`:""}
    <div class="seals" id="seals${idx}" aria-hidden="true"></div>
    <div class="row">
      <input type="text" id="answer${idx}" ${TOUCH?'readonly inputmode="none"':""} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Spelling for word ${idx+1}" ${item.lang==="es"?'lang="es"':""}>
    </div>
    ${item.lang==="es" && !TOUCH ? `<div class="row accents">${[..."áéíóúñü"].map(c=>`<button class="ghost small" data-acc="${c}" data-at="${idx}" aria-label="Type ${c}">${c}</button>`).join("")}</div>`:""}
    <div class="row">
      <button class="ghost" data-hear="${idx}">🔊 Hear word</button>
      <button class="ghost" data-sent="${idx}">Hear sentence</button>
      <button class="ghost" data-peek="${idx}">Peek (half power)</button>
    </div>
    <div id="peekOut${idx}"></div>
  </div>`;
}

function showSpelling(d){
  const i=d.turn, foe=1-i, p=d.seats[i], lvl=p.lvl, {items,shield}=d.cur;
  if(!spell || spell.id!==d.cur.id) spell={id:d.cur.id, items, shield, picked:null, peeked:false, active:true};
  spell.active=true; casting=false;
  const foeName=esc(seatName(d,foe));
  const picker = shield ? `
    <div class="wordbox">
      <p class="picktitle">${foeName} has a <span style="color:${ELEMENTS[shield].c};text-shadow:0 1px 0 #2b2216">${ELEMENTS[shield].label}</span> shield up. Pick your element:</p>
      <div class="chips" id="elPick">
        ${EL_KEYS.map(k=>`<button class="chip" style="--c:${ELEMENTS[k].c}" data-v="${k}" aria-pressed="${spell.picked===k}">${ELEMENTS[k].label}</button>`).join("")}
      </div>
      <p class="needs">${LEVELS[lvl].el==="bonus"
        ? `Right element = ${BONUS}× damage. Wrong element still works, just weaker.`
        : `Wrong element = your jutsu backfires and you lose ${BACKFIRE} chakra.`}</p>
    </div>` : "";
  $("panel").innerHTML=`
    <p class="jutsu">${rankLabel(p)} · ${items.length>1?"Double jutsu! Spell both words":"Spell the word"}</p>
    <p class="who">${esc(seatName(d,i))}, charge your jutsu</p>
    ${picker}
    ${items.map((it,k)=>wordBlock(it,k,items.length)).join("")}
    <div class="row"><button id="castBtn">Cast jutsu</button></div>
    ${canSpeak?"":`<p class="hint">This browser can't speak words aloud, so use Peek.</p>`}`;

  if(shield){
    const g=$("elPick");
    g.addEventListener("click",e=>{
      const b=e.target.closest(".chip"); if(!b) return;
      spell.picked=b.dataset.v; sendTyping();
      g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
      tone(660,.08,"triangle",0,.08);
    });
  }
  items.forEach((it,k)=>{
    const inp=$("answer"+k);
    inp.addEventListener("input",()=>{
      const s=$("seals"+k);
      const letters=inp.value.replace(/\s/g,"");
      if(letters.length>s.children.length) sfx.seal();
      const col = spell.picked ? ELEMENTS[spell.picked].c : p.color;
      s.innerHTML=[...letters].map(ch=>`<span class="seal" style="background:${col};color:#0c1024">${esc(ch.toUpperCase())}</span>`).join("");
      sendTyping();
    });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submitField(k); });
    inp.addEventListener("focus",()=>setActive(k));
    inp.addEventListener("click",()=>setActive(k));
    inp.addEventListener("paste",e=>e.preventDefault());
  });
  const panel=$("panel");
  panel.querySelectorAll("[data-hear]").forEach(b=>b.onclick=()=>speak(items[+b.dataset.hear].w,.8,items[+b.dataset.hear].lang));
  panel.querySelectorAll("[data-sent]").forEach(b=>b.onclick=()=>speak(items[+b.dataset.sent].s,.9,items[+b.dataset.sent].lang));
  panel.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.at, inp=$("answer"+k); if(!inp) return; setActive(k); inp.value+=b.dataset.acc; inp.dispatchEvent(new Event("input")); inp.focus(); });
  panel.querySelectorAll("[data-peek]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.peek; spell.peeked=true; b.disabled=true; sendTyping();
    const out=$("peekOut"+k);
    out.innerHTML=`<p class="peeked">${esc(items[k].w)}</p>`;
    setTimeout(()=>{out.innerHTML=`<p class="hint">The word vanished. Now spell it from memory.</p>`},1600);
    setActive(k); if(!TOUCH) $("answer"+k).focus();
  });
  $("castBtn").onclick=cast;
  setActive(0); showKb(true);
  if(shield) document.querySelector("#elPick .chip").focus();
  else if(!TOUCH) $("answer0").focus();
}

function cast(){
  if(casting || !spell) return;
  const d=latest, {items,shield,picked,peeked}=spell;
  if(shield && !picked){
    const n=document.querySelector(".needs"); n.textContent="Pick an element first!"; n.style.color="#b3202f";
    n.scrollIntoView({block:"center",behavior:"smooth"}); return;
  }
  const guesses=items.map((_,k)=>$("answer"+k).value.trim());
  const empty=guesses.findIndex(g=>!g);
  if(empty>-1){ setActive(empty); if(!TOUCH) $("answer"+empty).focus(); return; }
  casting=true; $("castBtn").disabled=true; showKb(false);

  const i=d.turn, foe=1-i, lvl=d.seats[i].lvl;
  const stats=clone(d.stats), st=stats[i];
  const wrong=items.filter((it,k)=>plain(guesses[k])!==plain(it.w)).map(x=>x.w);
  const accentFix=items.filter((it,k)=>plain(guesses[k])===plain(it.w) && guesses[k].toLowerCase()!==it.w.toLowerCase()).map(x=>x.w);
  const rightEl = shield ? picked===counterOf(shield) : true;
  const castEl = picked || EL_KEYS[Math.random()*EL_KEYS.length|0];
  const move = ELEMENTS[castEl].moves[Math.random()*3|0];
  let outcome, dmg=0, self=0;
  if(wrong.length){ outcome="fizzle"; st.fizzles++; st.missed.push(...wrong); }
  else if(LEVELS[lvl].el==="must" && !rightEl){ outcome="backfire"; self=BACKFIRE; st.backfires++; }
  else {
    outcome="hit"; st.hits++;
    dmg = items.reduce((s,it)=>s+10+it.w.length*2,0);
    if(shield && rightEl){ dmg=Math.round(dmg*BONUS); st.bonus++; }
    if(shield && !rightEl) dmg=Math.round(dmg*.7);
    if(peeked) dmg=Math.ceil(dmg/2);
  }
  const hp={"0":d.hp["0"],"1":d.hp["1"]};
  hp[foe]=Math.max(0,hp[foe]-dmg); hp[i]=Math.max(0,hp[i]-self);
  const over = hp[foe]===0 || hp[i]===0;
  write({
    hp, stats, turn:foe, phase:"ready", cur:null,
    status: over ? "over" : "playing",
    winner: over ? (hp[foe]===0 ? i : foe) : null,
    last:{id:rid(), by:i, outcome, move, color:ELEMENTS[castEl].c, dmg, self,
          words:items.map(x=>x.w), guesses, wrong, accentFix, lang:items[0].lang||"en", picked:picked||null, shield:shield||null, peeked}
  });
}

function animate(L,done){
  const fx=$("fx"), c=L.color, i=L.by;
  if($("gameView").hidden){ return done(); }
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const banner=t=>{const b=document.createElement("div");b.className="banner";b.style.color=c;b.textContent=t;fx.appendChild(b);setTimeout(()=>b.remove(),1050)};
  const shake=n=>{const el=$("n"+n);el.classList.remove("hit");void el.offsetWidth;el.classList.add("hit")};
  sfx.cast(); banner(L.move);
  const orb=document.createElement("div"); orb.className="orb"; orb.style.setProperty("--c",c);
  const from=i===0?24:67, to=i===0?72:20, mid=(from+to)/2;
  orb.style.left=from+"%"; fx.appendChild(orb);
  let frames, dur=700;
  if(L.outcome==="hit") frames=[{left:from+"%",transform:"scale(.6)"},{left:to+"%",transform:"scale(1.3)"}];
  else if(L.outcome==="fizzle"){ frames=[{left:from+"%",transform:"scale(.6)",opacity:1},{left:mid+"%",transform:"scale(1.6)",opacity:0,filter:"grayscale(1) blur(6px)"}]; dur=800; }
  else { frames=[{left:from+"%",transform:"scale(.6)"},{left:(to-6*(i===0?1:-1))+"%",transform:"scale(1.2)",offset:.55},{left:from+"%",transform:"scale(1.4)"}]; dur=1100; }
  if(!reduce) orb.animate(frames,{duration:dur,easing:"ease-in-out",fill:"forwards"});
  setTimeout(()=>{
    orb.remove();
    if(L.outcome==="hit"){ sfx.hit(); shake(1-i); banner("-"+L.dmg); }
    else if(L.outcome==="fizzle"){ sfx.fizzle(); banner("FIZZLE…"); }
    else { sfx.hit(); shake(i); banner("BACKFIRE -"+L.self); }
    setTimeout(done,700);
  }, reduce?200:dur);
}

function renderWin(d){

    actions = `<span class="hint">Waiting to see if they rematch… ${said}</span>`;
  }
  v.innerHTML=`
    <h2 style="color:${d.seats[w].color}">${esc(seatName(d,w))} wins the duel!</h2>

    <div class="stats" style="margin-top:16px">
      ${[0,1].map(i=>{const s=d.stats[i], p=d.seats[i];return `<div class="stat">

        <div><b>${s.hits}</b> landed · <b>${s.fizzles}</b> fizzled${LEVELS[p.lvl].el!=="none"?` · <b>${s.bonus}</b> super effective`:""}${LEVELS[p.lvl].el==="must"?` · <b>${s.backfires}</b> backfired`:""}</div>
        ${s.missed.length?`<div class="hint" style="margin-top:6px">Words to practice:</div><ul class="missed">${s.missed.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:`<div class="hint" style="margin-top:6px">No misspellings. Perfect!</div>`}
      </div>`}).join("")}
    </div>
    <div class="start-row" style="margin-top:16px">${actions}</div>`;
  if($("rematch")) $("rematch").onclick=()=>write(freshMatch());
  if($("changeSetup")) $("changeSetup").onclick=()=>write({status:"lobby", seats:{"0":{ready:false},"1":{ready:false}}});
  if($("againBtn")) $("againBtn").onclick=()=>{ unlockAudio(); act({kind:"again", v:true}); };
  if($("doneBtn")) $("doneBtn").onclick=()=>act({kind:"again", v:false});
}

/* ---------- live view of the other player's spelling ---------- */
let lastTyping=null, typingTimer=null;
function sendTyping(){
  if(mode!=="online" || !spell) return;
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{
    if(!spell) return;
    const msg={type:"typing", id:spell.id,
      answers:spell.items.map((_,k)=>{ const el=$("answer"+k); return el ? el.value.slice(0,24) : ""; }),
      picked:spell.picked||null, peeked:!!spell.peeked};
    if(isHost) broadcast(msg);
    else if(linkUp()){ try{ conn.send(msg); }catch(e){} }
  }, 40);
}
function onTyping(m){
  if(!m || typeof m.id!=="string" || !Array.isArray(m.answers)) return;
  lastTyping=m;
  paintWatch();
}
function paintWatch(){
  const d=latest;
  if(!d || d.phase!=="spelling" || !d.cur || mine(d.turn)) return;
  const t = lastTyping && lastTyping.id===d.cur.id ? lastTyping : null;
  const name=esc(seatName(d,d.turn));
  d.cur.items.forEach((it,k)=>{
    const box=$("watch"+k), note=$("watchNote"+k); if(!box) return;
    const typed=t ? String(t.answers[k]||"").replace(/\s/g,"") : "";
    const target=it.w.toLowerCase();
    let html="", allOk=true;
    [...typed].forEach((ch,j)=>{
      const ok = plain(target[j])===plain(ch); if(!ok) allOk=false;
      html+=`<span class="seal ${ok?"ok":"bad"}">${esc(ch.toUpperCase())}</span>`;
    });
    for(let j=typed.length;j<target.length;j++) html+=`<span class="seal empty">·</span>`;
    box.innerHTML = typed || t ? html : `<span class="hint">Waiting for ${name} to type…</span>`;
    if(!note) return;
    if(!typed){ note.textContent=""; note.className="watchnote"; }
    else if(!allOk || typed.length>target.length){ note.textContent="Uh oh, that's not right so far."; note.className="watchnote bad"; }
    else if(typed.length===target.length){ note.textContent="Spelled right! Brace yourself."; note.className="watchnote ok"; }
    else { note.textContent="On track so far…"; note.className="watchnote ok"; }
  });
  const we=$("watchEl");
  if(we && d.cur.shield){
    if(t && t.picked && ELEMENTS[t.picked]){
      const good = t.picked===counterOf(d.cur.shield);
      const viewerKage = d.seats[String(1-d.turn)].lvl==="kage";
      we.innerHTML=`${name} picked <b style="color:${ELEMENTS[t.picked].c};text-shadow:0 1px 0 #2b2216">${ELEMENTS[t.picked].label}</b>.${viewerKage?"":(good?" That beats your shield!":" That doesn't beat your shield.")}`;
    } else we.textContent=`${name} hasn't picked an element yet.`;
  }
  const wp=$("watchPeek"); if(wp) wp.hidden=!(t && t.peeked);
}

/* ---------- QR code for joining ---------- */
function drawQR(url){
  const box=$("qr"); if(!box) return;
  if(typeof window.QRCode!=="function"){ box.hidden=true; return; }
  box.innerHTML="";
  try{ new QRCode(box,{text:url,width:152,height:152,colorDark:"#0c1024",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ box.hidden=true; }
}

/* ---------- main menu button (on every screen) ---------- */
function updateHomeBtn(){ $("homeBtn").hidden = mode===null; }
$("homeBtn").onclick=()=>{
  const inDuel = latest && latest.status==="playing";
  const online = mode==="online";
  if(!inDuel && !online){ return renderHome(); }
  $("homeConfirmText").textContent = inDuel
    ? (online ? "Leave this duel and go to the main menu? The other player will be told you left." : "Quit this duel and go to the main menu?")
    : (isHost ? "Close your game room and go to the main menu?" : "Leave this game room and go to the main menu?");
  $("homeConfirm").hidden=false;
  $("homeYes").focus();
};
$("homeYes").onclick=()=>{ unlockAudio(); renderHome(); };
$("homeNo").onclick=()=>{ $("homeConfirm").hidden=true; };
setInterval(updateHomeBtn, 400);

/* ---------- share ---------- */
async function shareLink(url, text){
  if(navigator.share){
    try{ await navigator.share({title:"Spell Jutsu Duel", text, url}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(url); notice("Link copied. Paste it into a text to send it."); }
  catch(e){
    const p=$("sharePanel"); $("shareLink").value=url; p.hidden=false;
    $("shareLink").focus(); $("shareLink").select();
    notice("Copy the link below, then paste it into a text.");
  }
}
$("shareBtn").onclick = () => {
  const url = roomCode && isHost ? roomLink(roomCode) : baseLink();
  shareLink(url, roomCode && isHost ? "Let's duel! Tap to join my Spell Jutsu Duel:" : "Play Spell Jutsu Duel:");
};
$("copyLink").onclick = () => {
  const inp=$("shareLink");
  try{ navigator.clipboard.writeText(inp.value).then(()=>{ $("copyLink").textContent="Copied!"; setTimeout(()=>$("copyLink").textContent="Copy link",2000); }, ()=>{ inp.focus(); inp.select(); }); }
  catch(e){ inp.focus(); inp.select(); }
};

boot();
</script>
